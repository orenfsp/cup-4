name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, build and format check
        run: npm run check

  compose:
    name: Compose build and readiness
    runs-on: ubuntu-latest
    needs: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare local environment
        run: cp .env.example .env

      - name: Build and start Compose
        run: docker compose up --build -d --wait

      - name: Check API readiness
        run: curl --fail --silent --show-error http://localhost:8080/api/ready/

      - name: Show service status
        run: docker compose ps

      - name: Collect Compose logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop Compose
        if: always()
        run: docker compose down -v

  deploy:
    name: Deploy on self-hosted machine
    runs-on: [self-hosted, linux, x64, otklik]
    needs: [web, compose]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout pushed commit
        uses: actions/checkout@v4

      - name: Build and restart service
        run: docker compose up --build -d --wait

      - name: Check deployed readiness
        run: curl --fail --silent --show-error http://localhost:8080/api/ready/

      - name: Show deployed service status
        run: docker compose ps
